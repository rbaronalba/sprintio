services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sprintio
      POSTGRES_PASSWORD: sprintio
      POSTGRES_DB: sprintio
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sprintio']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://sprintio:sprintio@db:5432/sprintio?schema=public
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '4200:80'
    depends_on:
      - api

volumes:
  db-data:
