<div class="auth-split">

  <section class="cinema">
    <p class="cinema-mark">Sprintio</p>
    <div>
      <p class="cinema-kicker label-caps">A la parrilla</p>
      <h1 class="cinema-headline">Tu primera vuelta empieza aquí.</h1>
    </div>
  </section>

  <main class="panel">
    <h2 class="panel-title">Crear cuenta</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="name-row">
        <div>
          <label for="firstName" class="label-caps">Nombre</label>
          <input id="firstName" type="text" formControlName="firstName" autocomplete="given-name" />
        </div>
        <div>
          <label for="lastName" class="label-caps">Apellido</label>
          <input id="lastName" type="text" formControlName="lastName" autocomplete="family-name" />
        </div>
      </div>

      <label for="email" class="label-caps">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />

      <label for="password" class="label-caps">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
      />
      <small class="hint">Al menos 8 caracteres.</small>

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || pending()">
        {{ pending() ? 'Creando cuenta…' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="switch">¿Ya tienes cuenta? <a routerLink="/login" queryParamsHandling="preserve">Inicia sesión</a></p>
  </main>
</div>
