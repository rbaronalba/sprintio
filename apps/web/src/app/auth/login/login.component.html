<div class="auth-split">

  <section class="cinema">
    <p class="cinema-mark">Sprintio</p>
    <div>
      <h1 class="cinema-headline">Hecho para el pit lane.</h1>
    </div>
  </section>

  <main class="panel">
    <h2 class="panel-title">Iniciar sesión</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="email" class="label-caps">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />

      <label for="password" class="label-caps">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || pending()">
        {{ pending() ? 'Iniciando sesión…' : 'Iniciar sesión' }}
      </button>
    </form>

    @if (microsoft()) {
      <div class="sso">
        <p class="sso-or"><span>o</span></p>
        <!-- A real navigation, not an XHR: the whole OAuth dance happens in this tab. -->
        <a class="btn btn-outline sso-btn" href="/auth/microsoft">
          <svg viewBox="0 0 21 21" width="18" height="18" aria-hidden="true">
            <rect x="1" y="1" width="9" height="9" fill="#f25022" />
            <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
            <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
            <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
          </svg>
          Iniciar sesión con Microsoft
        </a>
      </div>
    }

    @if (!microsoft()) {
      <p class="switch">¿No tienes cuenta? <a routerLink="/register" queryParamsHandling="preserve">Créala</a></p>
    }
  </main>
</div>
