<div class="auth-split">
  <app-theme-toggle class="corner-toggle" />

  <section class="cinema">
    <p class="cinema-mark">Sprintio</p>
    <div>
      <h1 class="cinema-headline">Built for the pit lane.</h1>
    </div>
  </section>

  <main class="panel">
    <h2 class="panel-title">Sign in</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="email" class="label-caps">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />

      <label for="password" class="label-caps">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || pending()">
        {{ pending() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="switch">No account? <a routerLink="/register" queryParamsHandling="preserve">Create one</a></p>
  </main>
</div>
