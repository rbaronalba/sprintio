server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /auth/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # /boards/:id is both an API path and an SPA route: browser navigations get the app.
  location ~ ^/(boards|lists|cards)(/|$) {
    if ($http_accept ~* "text/html") {
      rewrite ^ /index.html last;
    }
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed bundles never change: cache hard, and 404 (not index.html) when one is gone.
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The shell must be revalidated every load, or browsers keep an old index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
