name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default: no step here needs to write to the repo.
permissions:
  contents: read

# Third-party actions are pinned to a commit SHA: a tag can be moved to malicious code,
# a SHA cannot. Dependabot (.github/dependabot.yml) keeps the pins current.
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just the tip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Production dependencies only: dev tooling never reaches the runtime images.
      - run: pnpm audit --prod --audit-level=high

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api run lint
      - run: pnpm --filter api run format:check
      - run: pnpm --filter api run build
      - run: pnpm --filter api run test:cov

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web run lint
      - run: pnpm --filter web run format:check
      - run: pnpm --filter web run build
      - run: pnpm --filter web run test:cov

  # Browser tests against the real stack: the only job that proves the SSE stream,
  # nginx's proxy_buffering and the drag-and-drop persistence actually work together.
  e2e:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: cipassword
      JWT_SECRET: ci-jwt-secret-not-used-anywhere-else-0123456789
      # The suite signs up a dozen accounts from one IP in seconds, which is precisely
      # what the production default of 10/min exists to block. See apps/api auth.controller.
      AUTH_RATE_LIMIT: 500
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --build
      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://sprintio:cipassword@localhost:5432/sprintio?schema=public
      - name: Wait for the web app
        run: timeout 120 bash -c 'until curl -sf http://localhost:4200 > /dev/null; do sleep 2; done'
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web run e2e
      - name: API smoke tests
        run: for f in apps/api/test/*.smoke.mjs; do node "$f" || exit 1; done
      - if: failure()
        run: docker compose logs --tail 200
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/test-results

  # Slow, so not on every PR: checks that the tests of the pure logic actually fail when it breaks.
  mutation:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api run test:mutation
