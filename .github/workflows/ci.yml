name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default: no step here needs to write to the repo.
permissions:
  contents: read

# Third-party actions are pinned to a commit SHA: a tag can be moved to malicious code,
# a SHA cannot. Dependabot (.github/dependabot.yml) keeps the pins current.
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just the tip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Production dependencies only: dev tooling never reaches the runtime images.
      - run: pnpm audit --prod --audit-level=high

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api run lint
      - run: pnpm --filter api run build
      - run: pnpm --filter api run test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web run build
      - run: pnpm --filter web exec ng test --watch=false --browsers=ChromeHeadless

  # Browser tests against the real stack: the only job that proves the SSE stream,
  # nginx's proxy_buffering and the drag-and-drop persistence actually work together.
  e2e:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: cipassword
      JWT_SECRET: ci-jwt-secret-not-used-anywhere-else-0123456789
      # The suite signs up a dozen accounts from one IP in seconds, which is precisely
      # what the production default of 10/min exists to block. See apps/api auth.controller.
      AUTH_RATE_LIMIT: 500
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --build
      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://sprintio:cipassword@localhost:5432/sprintio?schema=public
      - name: Wait for the web app
        run: timeout 120 bash -c 'until curl -sf http://localhost:4200 > /dev/null; do sleep 2; done'
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web run e2e
      - name: API smoke tests
        run: for f in apps/api/test/*.smoke.mjs; do node "$f" || exit 1; done
      - if: failure()
        run: docker compose logs --tail 200
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/test-results
